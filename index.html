<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トリプル・リング・キューブ (デモ)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <h1>トリプル・リング・キューブ (デモ)</h1>
    
    <div id="status">
      <span id="moveCounter">手数: 0</span>
    </div>

    <svg id="puzzleSvg" viewBox="0 0 500 450" xmlns="http://www.w3.org/2000/svg"></svg>

    <div id="controls">
      <p>操作する軸を選択:</p>
      <div id="axisSelectors">
        <button data-axis="0" class="axis-selector active">X軸 (上)</button>
        <button data-axis="1" class="axis-selector">Y軸 (左下)</button>
        <button data-axis="2" class="axis-selector">Z軸 (右下)</button>
      </div>

      <div id="actionButtons">
        <button id="rotateCW">時計回り (▶️)</button>
        <button id="rotateCCW">反時計回り (◀️)</button>
      </div>
      
      <div id="utilityButtons">
        <button id="shuffleButton">シャッフル</button>
        <button id="undoButton">やり直す (Undo)</button>
        <button id="solveButton">揃える (Solve)</button>
      </div>
    </div>
    
    <p id="message"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
